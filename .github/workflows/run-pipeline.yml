name: Run Bird Pipeline

on:
  workflow_dispatch:
    inputs:
      species_filter:
        description: 'Fuzzy filter za naziv vrste ptica (opcionalno, npr. "Kingfisher")'
        required: false
        default: ''
      fuzzy_threshold:
        description: 'Fuzzy threshold za matching (0-100, default 80)'
        required: false
        default: '80'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Snakemake pipeline
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_TOPIC: ${{ secrets.KAFKA_TOPIC }}
          BIRD_CLASSIFICATION_API: ${{ secrets.BIRD_CLASSIFICATION_API }}
          SPECIES_DATA_URL: ${{ secrets.SPECIES_DATA_URL }}
        run: |
          snakemake --cores 1 \
            --config \
              species_filter="${{ github.event.inputs.species_filter }}" \
              fuzzy_threshold="${{ github.event.inputs.fuzzy_threshold }}"

      - name: Upload CSV report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bird-report-csv
          path: output/bird_report.csv

      - name: Upload visualization as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bird-report-visualization
          path: output/bird_report.png
